// Colored Translit [v1.2] by Sho0ter
// Файл настройки

// Русский чат
// 0 - Выключен
// 1 - Включен
// По умолчанию: 1
amx_translit "1"

// Запись русского чата в лог
// 0 - Выключена
// 1 - Включена
// По умолчанию: 1
amx_translit_log "1"

// Цвет ника амдина в чате
// 1 - Стандартный
// 2 - Зеленый
// 3 - Серый
// 4 - Синий
// 5 - Красный
// 6 - Цвет команды
// По умолчанию: 6
amx_name_color "6"

// Цвет сообщений админа в чате
// 1 - Стандартный
// 2 - Зеленый
// 3 - Серый
// 4 - Синий
// 5 - Красный
// 6 - Цвет команды
// По умолчанию: 1
amx_chat_color "1"

// Все пишут всем
// 0 - Выключено
// 1 - Включено
// 2 - Только админы пишут всем
// По умолчанию: 1
amx_allchat "0"

// Приставка к нику админа
// 0 - Выключена
// 1 - Включена
// По умолчанию: 1
amx_admin_prefix "1"

// Админы видят весь чат
// 0 - Выключено
// 1 - Включено
// По умолчанию: 1
amx_listen "1"

// Анти-мат
// 0 - Выключен
// 1 - Включен
// По умолчанию: 1
amx_swear_filter "1"

// Иммунитет админов к анти-мату
// 0 - Выключен
// 1 - Включен
// По умолчанию: 1
amx_swear_immunity "1"

// Автоматическое выставление русского языка
// 0 - Выключено
// 1 - Включено
// По умолчанию: 1
amx_auto_rus "1"

// Информация о чат-командах при подключении
// 0 - Выключена
// 1 - Включена
// По умолчанию: 1
amx_show_info "1"

// Использование игнор-листа
// 0 - Выключено
// 1 - Включено
// По умолчанию: 1
amx_ignore "1"